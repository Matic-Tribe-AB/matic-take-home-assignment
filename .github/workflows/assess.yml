name: Automated Assessment

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.candidate-meta.json'

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Read candidate name from metadata file ────────────────────────────────────
      - name: Read candidate metadata
        id: meta
        run: |
          if [ -f .candidate-meta.json ]; then
            NAME=$(node -e "console.log(require('./.candidate-meta.json').name || '')")
            echo "name=$NAME" >> $GITHUB_OUTPUT
          else
            echo "name=Unknown" >> $GITHUB_OUTPUT
          fi

      # ── Check required deliverable files ───────────────────────────────────
      - name: Check required files
        id: files
        run: |
          echo "design_exists=$([ -f DESIGN.md ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "ailog_exists=$([ -f AI_LOG.md ] && echo true || echo false)" >> $GITHUB_OUTPUT

      # ── Restore backend ───────────────────────────────────────────────────────
      - name: Restore backend dependencies
        working-directory: backend
        run: dotnet restore
        continue-on-error: true

      # ── Run candidate's own tests ───────────────────────────────────────────
      - name: Run backend tests
        id: tests
        working-directory: backend
        run: |
          dotnet test 2>&1 | tee /tmp/test-output.txt || true
          PASSED=$(grep -oP 'Passed:\s+\K\d+' /tmp/test-output.txt | awk '{sum+=$1} END {print sum+0}')
          FAILED=$(grep -oP 'Failed:\s+\K\d+' /tmp/test-output.txt | awk '{sum+=$1} END {print sum+0}')
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── Start backend and test all API endpoints ────────────────────────────────
      - name: Test API endpoints
        id: api
        run: |
          cd backend && dotnet run --project PostFeed.Api &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

          BASE="http://localhost:3001/api"

          POST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/posts" \
            -H "Content-Type: application/json" \
            -d '{"title":"Assessment test","body":"Automated check"}' || echo 0)

          GET_RESPONSE=$(curl -s "$BASE/posts" || echo '[]')
          GET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/posts" || echo 0)

          POST_ID=$(echo "$GET_RESPONSE" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{
                const posts = JSON.parse(d);
                console.log(Array.isArray(posts) && posts[0] ? posts[0].id || '' : '')
              } catch(e){ console.log('') }
            })" || echo '')

          if [ -n "$POST_ID" ]; then
            PATCH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$BASE/posts/$POST_ID" || echo 0)
            DELETE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$BASE/posts/$POST_ID" || echo 0)
          else
            PATCH_STATUS="skipped"
            DELETE_STATUS="skipped"
          fi

          NOT_FOUND=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/posts/nonexistent-id-xyz" || echo 0)

          echo "get_status=$GET_STATUS"       >> $GITHUB_OUTPUT
          echo "post_status=$POST_STATUS"     >> $GITHUB_OUTPUT
          echo "patch_status=$PATCH_STATUS"   >> $GITHUB_OUTPUT
          echo "delete_status=$DELETE_STATUS" >> $GITHUB_OUTPUT
          echo "not_found_status=$NOT_FOUND"  >> $GITHUB_OUTPUT

          kill $SERVER_PID 2>/dev/null || true
        continue-on-error: true

      # ── Count code written (AI usage proxy) ──────────────────────────────────
      - name: Count code and words
        id: stats
        run: |
          BE=$(find backend -name "*.cs" 2>/dev/null | grep -v /obj/ | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo 0)
          FE=$(find frontend/src -name "*.jsx" -o -name "*.tsx" -o -name "*.js" -o -name "*.ts" 2>/dev/null | grep -v node_modules | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo 0)
          TF=$(find . \( -name "*.test.*" -o -name "*.spec.*" -o -name "*Tests.cs" -o -name "*Test.cs" \) 2>/dev/null | grep -v node_modules | grep -v /obj/ | wc -l || echo 0)
          DW=$([ -f DESIGN.md ] && wc -w < DESIGN.md || echo 0)
          AW=$([ -f AI_LOG.md ] && wc -w < AI_LOG.md || echo 0)
          echo "backend_lines=$BE"   >> $GITHUB_OUTPUT
          echo "frontend_lines=$FE"  >> $GITHUB_OUTPUT
          echo "test_files=$TF"      >> $GITHUB_OUTPUT
          echo "design_words=$DW"    >> $GITHUB_OUTPUT
          echo "ailog_words=$AW"     >> $GITHUB_OUTPUT

      # ── Send results to portal webhook ────────────────────────────────────────
      - name: Send assessment results
        if: ${{ env.ASSESSMENT_WEBHOOK_URL != '' }}
        env:
          ASSESSMENT_WEBHOOK_URL: ${{ secrets.ASSESSMENT_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "repo": "${{ github.repository }}",
            "candidate_name": "${{ steps.meta.outputs.name }}",
            "commit_sha": "${{ github.sha }}",
            "files": {
              "design_exists": ${{ steps.files.outputs.design_exists }},
              "ailog_exists": ${{ steps.files.outputs.ailog_exists }}
            },
            "tests": {
              "passed": "${{ steps.tests.outputs.passed }}",
              "failed": "${{ steps.tests.outputs.failed }}"
            },
            "api": {
              "get_status": "${{ steps.api.outputs.get_status }}",
              "post_status": "${{ steps.api.outputs.post_status }}",
              "patch_status": "${{ steps.api.outputs.patch_status }}",
              "delete_status": "${{ steps.api.outputs.delete_status }}",
              "not_found_status": "${{ steps.api.outputs.not_found_status }}"
            },
            "stats": {
              "backend_lines": "${{ steps.stats.outputs.backend_lines }}",
              "frontend_lines": "${{ steps.stats.outputs.frontend_lines }}",
              "test_files": "${{ steps.stats.outputs.test_files }}",
              "design_words": "${{ steps.stats.outputs.design_words }}",
              "ailog_words": "${{ steps.stats.outputs.ailog_words }}"
            }
          }
          EOF
          )
          curl -s -X POST "$ASSESSMENT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Webhook delivery failed (non-fatal)"
